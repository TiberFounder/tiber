[package]
name = "tiber-bridge"
description = "The Tiber bridge: wraps SPL Token and Token-2022 mints and native SOL into Tiber Token Standard mints one for one, and unwraps them."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "tiber_bridge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "tiber-token/idl-build", "tiber-hook/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = { workspace = true }
anchor-lang = { workspace = true, features = ["event-cpi"] }
tiber-token = { path = "../tiber_token", features = ["no-entrypoint"] }
tiber-hook = { path = "../../crates/tiber-hook" }

[lints]
workspace = true
