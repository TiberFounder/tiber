# Anchor workspace for the Tiber programs. The programs are built with `cargo build-sbf`
# (scripts/solana/programs.sh); the Anchor CLI is used for `anchor idl build` only. Tests are Rust
# LiteSVM tests (programs/tests), so no local validator is started.
skip_local_validator = true

[toolchain]
anchor_version = "1.2.0"
solana_version = "4.3.0"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[workspace]
members = [
  "programs/tiber_token",
  "programs/tiber_swap",
  "programs/tiber_bridge",
  "programs/tax_hook",
  "programs/hook_tester",
  "programs/tiber_twins",
  "programs/tiber_tithe",
]

# Romulus and Remus program IDs (generated 2026-10-31; keypairs in keys/devnet, git-ignored).
